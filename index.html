<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IQ Push</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; }
    body { display: grid; place-items: center; font: 16px sans-serif; }
  </style>
  <script type="module">
    let useWebGpu = false;
    let timeoutId;
    try {
      useWebGpu = await Promise.race([
        (async () => {
          if (!navigator.gpu) return false;
          const adapter = await navigator.gpu.requestAdapter();
          if (!adapter) return false;
          // Some embedded browsers expose an adapter but cannot create a usable WebGPU device.
          const device = await adapter.requestDevice();
          device.destroy();
          return true;
        })(),
        new Promise(resolve => {
          timeoutId = setTimeout(() => resolve(false), 5000);
        }),
      ]);
    } catch (_) {
      // Fall back when WebGPU is unavailable or device creation fails.
    } finally {
      clearTimeout(timeoutId);
    }
    window.location.replace(useWebGpu ? "webgpu/" : "webgl2/");
  </script>
</head>
<body>Checking graphics support…</body>
</html>
