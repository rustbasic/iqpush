<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IQ Push</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; }
    body { display: grid; place-items: center; font: 16px sans-serif; }
  </style>
  <script type="module">
    let useWebGpu = false;
    try {
      useWebGpu = !!(navigator.gpu && await navigator.gpu.requestAdapter());
    } catch (_) {
      // Fall back when WebGPU is unavailable or adapter acquisition is denied.
    }
    window.location.replace(useWebGpu ? "webgpu/" : "webgl2/");
  </script>
</head>
<body>Checking graphics support…</body>
</html>
